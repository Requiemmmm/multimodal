[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "morph-prototype"
version = "0.1.0"
description = "MORPH early-fusion multimodal research prototype"
requires-python = ">=3.10"
dependencies = ["torch>=2.3", "pyyaml>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]
